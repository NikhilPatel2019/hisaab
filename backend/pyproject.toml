[project]
name = "hisaab"
version = "0.1.0"
description = "Self-hosted, single-user personal finance dashboard for India."

license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "fastapi>=0.115",
    "google-auth>=2.30",
    "imap-tools>=1.7",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pymysql>=1.1",
    "pypdf>=6.0",
    "python-multipart>=0.0.18",
    "requests>=2.32",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
hisaab = "hisaab.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hisaab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S107", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hisaab"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hisaab.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
